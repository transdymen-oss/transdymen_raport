<!doctype html>
<html lang="pl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Status auta</title>


<style>

:root{
  --bg:#f3f5f8;
  --card:#fff;
  --text:#172033;
  --muted:#687386;
  --accent:#1a73e8;
  --danger:#c62828;
  --ok:#137333;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  font-family:Arial,sans-serif;
  color:var(--text);
}

.wrap{
  max-width:720px;
  margin:0 auto;
  padding:24px 14px 50px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:24px;
  box-shadow:0 5px 24px #00000012;
}

h1{
  margin:0 0 8px;
  text-align:center;
  font-size:28px;
}

.sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:24px;
}

label{
  display:block;
  font-weight:700;
  margin:0 0 8px;
}

.field{
  margin-bottom:18px;
}

input,
textarea{
  width:100%;
  padding:13px 14px;
  border:1px solid #d4d9e1;
  border-radius:11px;
  font:inherit;
  outline:0;
}

input:focus,
textarea:focus{
  border-color:var(--accent);
}

textarea{
  min-height:110px;
  resize:vertical;
}

button{
  border:0;
  border-radius:11px;
  padding:13px 16px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  width:100%;
  background:var(--accent);
  color:white;
}

.secondary{
  background:#eef1f5;
  color:#263244;
}

.hidden{
  display:none!important;
}

.msg{
  padding:12px;
  border-radius:10px;
  margin-bottom:16px;
  font-weight:600;
}

.err{
  background:#feeceb;
  color:var(--danger);
}

.ok{
  background:#e8f5e9;
  color:var(--ok);
}

.searchbox{
  position:relative;
}

.suggestions{
  position:absolute;
  z-index:5;
  left:0;
  right:0;
  top:100%;
  background:white;
  border:1px solid #ddd;
  max-height:230px;
  overflow:auto;
}

.suggestion{
  padding:12px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}

.suggestion:hover{
  background:#f5f7fa;
}

.selected{
  margin-top:9px;
  padding:11px;
  border-radius:10px;
  background:#e8f0fe;
  color:#174ea6;
  font-weight:700;
}


/* =========================
   WYBÓR OPERACJI
========================= */

.operation-box{
  margin-top:22px;
  padding-top:20px;
  border-top:1px solid #e2e6eb;
}

.operation-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:12px;
}

.operation-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.operation-button{
  min-height:70px;
  border:2px solid #d9dee6;
  background:#fff;
  color:var(--text);
  transition:.15s;
}

.operation-button:hover{
  border-color:var(--accent);
  background:#f7faff;
}

.operation-button.active{
  border-color:var(--accent);
  background:#e8f0fe;
  color:#174ea6;
}


/* =========================
   RAPORT
========================= */

.report-section{
  margin-top:22px;
  padding-top:22px;
  border-top:1px solid #e2e6eb;
}


/* =========================
   TANKOWANIE
========================= */

.refueling-section{
  margin-top:22px;
  padding-top:22px;
  border-top:1px solid #e2e6eb;
}

.date-time-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.readonly-field{
  background:#f5f7fa;
}

.required{
  color:var(--danger);
}


/* =========================
   ZDJĘCIA
========================= */

.upload{
  border:2px dashed #c7ccd4;
  border-radius:12px;
  padding:20px;
  text-align:center;
  background:#fafbfc;
  cursor:pointer;
}

.upload input{
  display:none;
}

.count{
  text-align:right;
  color:var(--muted);
  font-size:13px;
  margin-top:7px;
}

.preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}

.pic{
  position:relative;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:10px;
  background:#eee;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.x{
  position:absolute;
  right:5px;
  top:5px;
  width:28px;
  height:28px;
  padding:0;
  border-radius:50%;
  background:#000b;
  color:#fff;
}


/* =========================
   GÓRA
========================= */

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.user{
  color:var(--muted);
  font-size:14px;
}


/* =========================
   NAKŁADKA
========================= */

.loading-overlay{
  position:fixed;
  inset:0;
  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.94);

  backdrop-filter:blur(4px);

  padding:20px;
}

.loading-box{
  width:min(90%,360px);
  background:#fff;
  border-radius:20px;
  padding:30px 24px;
  text-align:center;

  box-shadow:
    0 15px 50px rgba(0,0,0,.18);
}

.loading-spinner{
  width:48px;
  height:48px;

  margin:0 auto 20px;

  border:5px solid #e2e7ee;
  border-top-color:var(--accent);

  border-radius:50%;

  animation:spin .8s linear infinite;
}

.loading-title{
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
}

.loading-text{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================
   STATUS API
========================= */

.statusbox{
  margin-top:16px;
  padding:10px;
  background:#f5f7fa;
  border-radius:10px;
  font-size:12px;
  color:#687386;
}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  .card{
    padding:18px;
  }

  .preview{
    grid-template-columns:repeat(2,1fr);
  }

  .operation-buttons{
    grid-template-columns:1fr;
  }

  .date-time-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<!-- =========================
     NAKŁADKA
========================= -->

<div
  id="loadingOverlay"
  class="loading-overlay hidden"
>

  <div class="loading-box">

    <div class="loading-spinner"></div>

    <div
      id="loadingTitle"
      class="loading-title"
    >
      Proszę czekać
    </div>

    <div
      id="loadingText"
      class="loading-text"
    >
      Trwa przetwarzanie...
    </div>

  </div>

</div>


<div class="wrap">


<!-- =========================
     LOGOWANIE
========================= -->

<div
  id="loginCard"
  class="card"
>

  <h1>STATUS AUTA</h1>

  <div class="sub">
    Logowanie pracownika
  </div>

  <div id="loginMsg"></div>

  <form id="loginForm">

    <div class="field">

      <label for="login">
        Login
      </label>

      <input
        id="login"
        autocomplete="username"
        required
      >

    </div>


    <div class="field">

      <label for="password">
        Hasło
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

    </div>


    <button
      class="primary"
      id="loginBtn"
    >
      ZALOGUJ SIĘ
    </button>

  </form>


  <div
    class="statusbox"
    id="connectionStatus"
  >
    API: sprawdzanie...
  </div>

</div>


<!-- =========================
     APLIKACJA
========================= -->

<div
  id="appCard"
  class="card hidden"
>

  <div class="top">

    <div>

      <strong>STATUS AUTA 1.0</strong>

      <div
        class="user"
        id="who"
      ></div>

    </div>


    <button
      class="secondary"
      id="logoutBtn"
    >
      Wyloguj
    </button>

  </div>


  <div id="appMsg"></div>


  <!-- =========================
       WYBÓR AUTA
  ========================= -->

  <div class="field">

    <label for="registration">
      Numer rejestracyjny
    </label>

    <div class="searchbox">

      <input
        id="registration"
        placeholder="Wpisz lub wybierz rejestrację..."
        autocomplete="off"
      >

      <div
        id="suggestions"
        class="suggestions hidden"
      ></div>

    </div>


    <div
      id="selected"
      class="selected hidden"
    ></div>

  </div>


  <!-- =========================
       WYBÓR OPERACJI
  ========================= -->

  <div
    id="operationSection"
    class="operation-box hidden"
  >

    <div class="operation-title">
      Wybierz operację
    </div>


    <div class="operation-buttons">

      <button
        type="button"
        id="reportOperationBtn"
        class="operation-button"
      >
        📋<br>
        DODAJ RAPORT AUTA
      </button>


      <button
        type="button"
        id="refuelingOperationBtn"
        class="operation-button"
      >
        ⛽<br>
        TANKOWANIE
      </button>

    </div>

  </div>


  <!-- =========================
       RAPORT AUTA
  ========================= -->

  <div
    id="reportSection"
    class="report-section hidden"
  >

    <div class="field">

      <label>
        Zdjęcia stanu auta
      </label>


      <label class="upload">

        <input
          id="photos"
          type="file"
          accept="image/*"
          multiple
          capture="environment"
        >

        <strong>
          📷 DODAJ ZDJĘCIA
        </strong>

        <br>

        <span
          style="color:#687386;font-size:13px"
        >
          maksymalnie 10
        </span>

      </label>


      <div
        id="preview"
        class="preview"
      ></div>


      <div
        id="count"
        class="count"
      >
        0 / 10 zdjęć
      </div>

    </div>


    <div class="field">

      <label for="notes">
        Uwagi
      </label>

      <textarea
        id="notes"
        placeholder="Wpisz uwagi dotyczące auta..."
      ></textarea>

    </div>


    <button
      class="primary"
      id="saveBtn"
      type="button"
    >
      ZAPISZ RAPORT AUTA
    </button>

  </div>


  <!-- =========================
       TANKOWANIE
  ========================= -->

  <div
    id="refuelingSection"
    class="refueling-section hidden"
  >

    <div class="field">

      <label>
        Data i godzina
      </label>


      <div class="date-time-grid">

        <div>

          <label
            for="refuelingDate"
            style="font-size:13px;font-weight:600"
          >
            Data
          </label>

          <input
            id="refuelingDate"
            class="readonly-field"
            type="text"
            readonly
          >

        </div>


        <div>

          <label
            for="refuelingTime"
            style="font-size:13px;font-weight:600"
          >
            Godzina
          </label>

          <input
            id="refuelingTime"
            class="readonly-field"
            type="text"
            readonly
          >

        </div>

      </div>

    </div>


    <div class="field">

      <label for="mileage">
        Przebieg <span class="required">*</span>
      </label>

      <input
        id="mileage"
        type="number"
        min="0"
        step="1"
        inputmode="numeric"
        placeholder="Wpisz aktualny przebieg"
      >

    </div>


    <button
      class="primary"
      id="saveRefuelingBtn"
      type="button"
    >
      ZAPISZ TANKOWANIE
    </button>

  </div>


</div>

</div>


<script>


/* =========================
   API
========================= */

const APPS_SCRIPT_URL =
'https://script.google.com/macros/s/AKfycbyvhK_3Y5PY0h3iMCZ7dWq_kyoH-uWmZQGhoCsXLZtxXSwZvhCF-PQBhLoXmkQwGWRB/exec';


let token =
sessionStorage.getItem('statusAutaToken') || '';


let employee =
sessionStorage.getItem('statusAutaUser') || '';


let registrations = [];

let selectedRegistration = '';

let files = [];

let selectedOperation = '';


/* =========================
   POMOCNICZE
========================= */

const $ = id =>
document.getElementById(id);


function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#39;'
        }[m];

      }
    );

}


function msg(element,text,ok=false){

  element.innerHTML =
    text
      ? '<div class="msg ' +
        (ok ? 'ok' : 'err') +
        '">' +
        escapeHtml(text) +
        '</div>'
      : '';

}


/* =========================
   NAKŁADKA
========================= */

function showLoading(title,text){

  $('loadingTitle').textContent =
    title || 'Proszę czekać';

  $('loadingText').textContent =
    text || 'Trwa przetwarzanie...';

  $('loadingOverlay')
    .classList.remove('hidden');

  document.body.style.overflow = 'hidden';
}


function hideLoading(){

  $('loadingOverlay')
    .classList.add('hidden');

  document.body.style.overflow = '';

}


/* =========================
   API
========================= */

async function api(action,data={}){

  const response =
    await fetch(
      APPS_SCRIPT_URL,
      {
        method:'POST',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:JSON.stringify({
          action:action,
          data:data
        })
      }
    );


  if(!response.ok){

    throw new Error(
      'Błąd HTTP: ' +
      response.status
    );

  }


  const result =
    await response.json();


  if(
    result &&
    result.success === false &&
    result.error
  ){

    throw new Error(
      result.error
    );

  }


  return result;

}


/* =========================
   TEST API
========================= */

async function testApi(){

  try{

    const result =
      await api('ping');


    $('connectionStatus').textContent =
      'API działa ✓ ' +
      (result.message || '');


  }catch(error){

    $('connectionStatus').textContent =
      'BŁĄD API: ' +
      error.message;

  }

}


/* =========================
   LOGOWANIE
========================= */

$('loginForm').onsubmit =
async function(event){

  event.preventDefault();


  msg(
    $('loginMsg'),
    ''
  );


  const login =
    $('login').value.trim();

  const password =
    $('password').value;


  if(!login || !password){

    msg(
      $('loginMsg'),
      'Podaj login i hasło.'
    );

    return;
  }


  $('loginBtn').disabled = true;


  showLoading(
    'LOGOWANIE',
    'Trwa logowanie, proszę czekać...'
  );


  try{

    const result =
      await api(
        'login',
        {
          login:login,
          password:password
        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.error ||
        'Nieprawidłowy login lub hasło.'
      );

    }


    token =
      result.token;

    employee =
      result.login;


    sessionStorage.setItem(
      'statusAutaToken',
      token
    );


    sessionStorage.setItem(
      'statusAutaUser',
      employee
    );


    const carResult =
      await api(
        'getRegistrations',
        {
          token:token
        }
      );


    if(
      !carResult ||
      !carResult.success
    ){

      throw new Error(
        carResult?.error ||
        'Nie udało się pobrać samochodów.'
      );

    }


    registrations =
      carResult.registrations || [];


    showApp();


  }catch(error){

    msg(
      $('loginMsg'),
      error.message
    );


  }finally{

    $('loginBtn').disabled = false;

    hideLoading();

  }

};


/* =========================
   PANEL
========================= */

function showApp(){

  $('loginCard')
    .classList.add('hidden');


  $('appCard')
    .classList.remove('hidden');


  $('who').textContent =
    'Zalogowano: ' + employee;

}


/* =========================
   RESET OPERACJI
========================= */

function resetOperation(){

  selectedOperation = '';


  $('reportSection')
    .classList.add('hidden');


  $('refuelingSection')
    .classList.add('hidden');


  $('reportOperationBtn')
    .classList.remove('active');


  $('refuelingOperationBtn')
    .classList.remove('active');


  $('mileage').value = '';

}


/* =========================
   WYLOGOWANIE
========================= */

$('logoutBtn').onclick =
async function(){

  try{

    showLoading(
      'WYLOGOWYWANIE',
      'Trwa wylogowywanie...'
    );


    if(token){

      await api(
        'logout',
        {
          token:token
        }
      );

    }


  }catch(error){

    console.log(error);


  }finally{

    token = '';

    employee = '';

    registrations = [];

    selectedRegistration = '';

    files = [];

    selectedOperation = '';


    sessionStorage.removeItem(
      'statusAutaToken'
    );


    sessionStorage.removeItem(
      'statusAutaUser'
    );


    $('appCard')
      .classList.add('hidden');


    $('loginCard')
      .classList.remove('hidden');


    $('password').value = '';

    $('login').value = '';


    $('registration').value = '';

    $('selected')
      .classList.add('hidden');


    $('operationSection')
      .classList.add('hidden');


    resetOperation();

    render();

    hideLoading();

  }

};


/* =========================
   REJESTRACJE
========================= */

$('registration').oninput =
function(){

  const query =
    $('registration')
      .value
      .trim()
      .toLowerCase();

  selectedRegistration = query;
  resetOperation();

  $('selected')
    .classList.add('hidden');

  if(!query){

    $('suggestions')
      .classList.add('hidden');

    $('operationSection')
      .classList.add('hidden');

    return;

  }

  const found =
    registrations
      .filter(
        function(reg){

          return reg
            .toLowerCase()
            .includes(query);

        }
      )
      .slice(0,20);


  $('suggestions').innerHTML = '';


  found.forEach(
    function(reg){

      const div =
        document.createElement('div');


      div.className =
        'suggestion';


      div.textContent =
        reg;


      div.onclick =
      function(){

        selectedRegistration =
          reg;


        $('registration').value =
          reg;


        $('selected').textContent =
          '✓ ' + reg;


        $('selected')
          .classList.remove('hidden');


        $('suggestions')
          .classList.add('hidden');


        resetOperation();


        $('operationSection')
          .classList.remove('hidden');

      };


      $('suggestions')
        .appendChild(div);

    }
  );


  $('suggestions')
    .classList.toggle(
      'hidden',
      found.length === 0
    );

  // Można wpisać zupełnie nowy numer ręcznie.
  // Jeśli użytkownik nie wybierze podpowiedzi, wpisany tekst
  // zostanie potraktowany jako nowa rejestracja.
  $('operationSection')
    .classList.remove('hidden');

};


/* =========================
   RAPORT AUTA - WYBÓR
========================= */

$('reportOperationBtn').onclick =
function(){

  if(!selectedRegistration){

    msg(
      $('appMsg'),
      'Najpierw wybierz samochód.'
    );

    return;

  }


  selectedOperation =
    'report';


  $('reportOperationBtn')
    .classList.add('active');


  $('refuelingOperationBtn')
    .classList.remove('active');


  $('reportSection')
    .classList.remove('hidden');


  $('refuelingSection')
    .classList.add('hidden');

};


/* =========================
   TANKOWANIE - WYBÓR
========================= */

$('refuelingOperationBtn').onclick =
function(){

  if(!selectedRegistration){

    msg(
      $('appMsg'),
      'Najpierw wybierz samochód.'
    );

    return;

  }


  selectedOperation =
    'refueling';


  $('refuelingOperationBtn')
    .classList.add('active');


  $('reportOperationBtn')
    .classList.remove('active');


  $('reportSection')
    .classList.add('hidden');


  $('refuelingSection')
    .classList.remove('hidden');


  setCurrentRefuelingDateTime();

};


/* =========================
   DATA / GODZINA
========================= */

function setCurrentRefuelingDateTime(){

  const now =
    new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(2,'0');


  const day =
    String(
      now.getDate()
    ).padStart(2,'0');


  const hours =
    String(
      now.getHours()
    ).padStart(2,'0');


  const minutes =
    String(
      now.getMinutes()
    ).padStart(2,'0');


  $('refuelingDate').value =
    year + '-' +
    month + '-' +
    day;


  $('refuelingTime').value =
    hours + ':' +
    minutes;

}


/* =========================
   ZDJĘCIA
========================= */

$('photos').onchange =
function(event){

  const incoming =
    [...event.target.files]
      .filter(
        file =>
          file.type.startsWith('image/')
      );


  if(
    files.length +
    incoming.length >
    10
  ){

    msg(
      $('appMsg'),
      'Możesz dodać maksymalnie 10 zdjęć.'
    );

    return;

  }


  files.push(
    ...incoming
  );


  render();


  event.target.value = '';

};


/* =========================
   RENDER ZDJĘĆ
========================= */

function render(){

  $('preview').innerHTML = '';


  files.forEach(
    function(file,index){

      const div =
        document.createElement('div');


      div.className =
        'pic';


      const img =
        document.createElement('img');


      img.src =
        URL.createObjectURL(file);


      const button =
        document.createElement('button');


      button.className =
        'x';


      button.textContent =
        '×';


      button.type =
        'button';


      button.onclick =
      function(){

        files.splice(
          index,
          1
        );


        render();

      };


      div.appendChild(img);

      div.appendChild(button);


      $('preview')
        .appendChild(div);

    }
  );


  $('count').textContent =
    files.length +
    ' / 10 zdjęć';

}


/* =========================
   KOMPRESJA
========================= */

function resizeImage(
  file,
  max = 1600,
  quality = 0.78
){

  return new Promise(
    function(resolve,reject){

      const img =
        new Image();


      const url =
        URL.createObjectURL(file);


      img.onload =
      function(){

        let width =
          img.naturalWidth;


        let height =
          img.naturalHeight;


        const scale =
          Math.min(
            1,
            max /
            Math.max(
              width,
              height
            )
          );


        width =
          Math.round(
            width * scale
          );


        height =
          Math.round(
            height * scale
          );


        const canvas =
          document.createElement(
            'canvas'
          );


        canvas.width =
          width;


        canvas.height =
          height;


        const context =
          canvas.getContext('2d');


        context.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        URL.revokeObjectURL(
          url
        );


        canvas.toBlob(
          function(blob){

            if(!blob){

              reject(
                new Error(
                  'Nie udało się skompresować zdjęcia.'
                )
              );

              return;

            }


            const reader =
              new FileReader();


            reader.onload =
            function(){

              resolve({

                name:
                  file.name.replace(
                    /\.[^.]+$/i,
                    '.jpg'
                  ),

                mimeType:
                  'image/jpeg',

                data:
                  reader.result
                    .split(',')[1]

              });

            };


            reader.onerror =
              reject;


            reader.readAsDataURL(
              blob
            );

          },
          'image/jpeg',
          quality
        );

      };


      img.onerror =
        reject;


      img.src =
        url;

    }
  );

}


/* =========================
   ZAPIS RAPORTU
========================= */

$('saveBtn').onclick =
async function(){

  msg(
    $('appMsg'),
    ''
  );


  const registration =
    selectedRegistration ||
    $('registration')
      .value
      .trim();


  if(!registration){

    msg(
      $('appMsg'),
      'Wpisz numer rejestracyjny.'
    );

    $('registration').focus();

    return;

  }


  if(selectedOperation !== 'report'){

    msg(
      $('appMsg'),
      'Wybierz opcję DODAJ RAPORT AUTA.'
    );

    return;

  }


  $('saveBtn').disabled =
    true;


  showLoading(
    'TRWA ZAPISYWANIE',
    'Zapisywanie raportu i zdjęć. Proszę czekać...'
  );


  try{

    const photos = [];


    for(
      const file of files
    ){

      photos.push(
        await resizeImage(file)
      );

    }


    const result =
      await api(
        'saveReport',
        {
          token:token,
          registration:registration,
          notes:$('notes').value.trim(),
          photos:photos
        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.error ||
        'Nie udało się zapisać danych.'
      );

    }


    msg(
      $('appMsg'),
      'Raport auta został zapisany. Zdjęć: ' +
      result.photoCount,
      true
    );


    $('registration').value =
      '';


    $('selected')
      .classList.add('hidden');


    $('operationSection')
      .classList.add('hidden');


    $('notes').value =
      '';


    selectedRegistration =
      '';


    selectedOperation =
      '';


    files = [];


    render();


  }catch(error){

    msg(
      $('appMsg'),
      error.message
    );


  }finally{

    $('saveBtn').disabled =
      false;


    hideLoading();

  }

};


/* =========================
   ZAPIS TANKOWANIA
========================= */

$('saveRefuelingBtn').onclick =
async function(){

  msg(
    $('appMsg'),
    ''
  );


  const registration =
    selectedRegistration ||
    $('registration')
      .value
      .trim();


  const mileage =
    $('mileage')
      .value
      .trim();


  if(!registration){

    msg(
      $('appMsg'),
      'Wpisz numer rejestracyjny.'
    );

    $('registration').focus();

    return;

  }


  /*
   * Przebieg jest wymagany.
   */

  if(!mileage){

    msg(
      $('appMsg'),
      'Przebieg jest wymagany przed zapisaniem tankowania.'
    );

    $('mileage').focus();

    return;

  }


  const mileageNumber =
    Number(
      mileage.replace(',','.')
    );


  if(
    !Number.isFinite(
      mileageNumber
    )
  ){

    msg(
      $('appMsg'),
      'Przebieg musi być liczbą.'
    );

    $('mileage').focus();

    return;

  }


  if(mileageNumber < 0){

    msg(
      $('appMsg'),
      'Przebieg nie może być ujemny.'
    );

    $('mileage').focus();

    return;

  }


  $('saveRefuelingBtn')
    .disabled = true;


  showLoading(
    'TRWA ZAPISYWANIE',
    'Zapisywanie tankowania. Proszę czekać...'
  );


  try{

    const result =
      await api(
        'saveRefueling',
        {
          token:token,
          registration:registration,
          mileage:mileage
        }
      );


    if(
      !result ||
      !result.success
    ){

      throw new Error(
        result?.error ||
        'Nie udało się zapisać tankowania.'
      );

    }


    msg(
      $('appMsg'),
      'Tankowanie zostało zapisane. Przebieg: ' +
      result.mileage,
      true
    );


    $('registration').value =
      '';


    $('selected')
      .classList.add('hidden');


    $('operationSection')
      .classList.add('hidden');


    $('mileage').value =
      '';


    selectedRegistration =
      '';


    selectedOperation =
      '';


    $('reportSection')
      .classList.add('hidden');


    $('refuelingSection')
      .classList.add('hidden');


  }catch(error){

    msg(
      $('appMsg'),
      error.message
    );


  }finally{

    $('saveRefuelingBtn')
      .disabled = false;


    hideLoading();

  }

};

========================= */

async function init(){

  testApi();


  if(!token){

    return;

  }


  try{

    const result =
      await api(
        'checkSession',
        {
          token:token
        }
      );


    if(
      !result ||
      !result.valid
    ){

      throw new Error(
        'Sesja wygasła.'
      );

    }


    employee =
      result.login;


    const carResult =
      await api(
        'getRegistrations',
        {
          token:token
        }
      );


    if(
      !carResult ||
      !carResult.success
    ){

      throw new Error(
        carResult?.error ||
        'Nie udało się pobrać samochodów.'
      );

    }


    registrations =
      carResult.registrations || [];


    showApp();


  }catch(error){

    sessionStorage.removeItem(
      'statusAutaToken'
    );


    sessionStorage.removeItem(
      'statusAutaUser'
    );


    token = '';

    employee = '';

  }

}


init();
